<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Куда пойдём? — На тропе · V02</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#24547a">
</head>
<body>
  <header>
    <h1>На тропе · V02</h1>

    <nav>
      <a href="index.html">Главная</a>
      <a href="form.html">Форма</a>
    </nav>
  </header>

    <main class="page">
    <h1>Куда пойдём?</h1>
    <p>Выберите одну из трёх позиций</p>

    <!-- Поле поиска -->
    <p>
      <label for="search">Поиск по названию</label>
      <input id="search" type="search" placeholder="Введите часть названия">
    </p>

    <!-- Контейнер, в который JS будет вставлять карточки -->
    <div id="catalog-list" class="products"></div>

    <!-- Статус (Показано: 3 из 3) -->
    <p id="status" role="status"></p>
  </main>

  <footer>
    <p>Учебный прототип · Вариант 02</p>
  </footer>

  <script src="catalog-page.js" defer></script>

  <!-- ДОБАВЛЕНО: Регистрация Service Worker -->
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js").catch((error) => {
        console.error("Не удалось зарегистрировать service worker:", error);
      });
    }
  </script>
</body>
</html>
